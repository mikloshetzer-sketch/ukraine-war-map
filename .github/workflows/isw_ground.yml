name: isw-ground-pipeline

on:
  workflow_dispatch: {}
  schedule:
    - cron: "35 4 * * *"  # naponta 04:35 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run ISW ground pipeline
        run: |
          python scripts/isw_ground_pipeline.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add \
            data/isw_ground_latest.geojson \
            data/isw_ground_7d.geojson \
            data/isw_ground_30d.geojson \
            data/isw_ground_index.json \
            data/geocode_cache.json
          git commit -m "Update ISW ground points" || echo "No changes"
          git push
