name: WP OAuth exchange (stable)

on:
  workflow_dispatch:
    inputs:
      authorization_code:
        description: "WordPress.com OAuth authorization code"
        required: true
        type: string

jobs:
  exchange:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Exchange code for WordPress.com token
        env:
          WPCOM_CLIENT_ID: ${{ secrets.WPCOM_CLIENT_ID }}
          WPCOM_CLIENT_SECRET: ${{ secrets.WPCOM_CLIENT_SECRET }}
          WPCOM_REDIRECT_URI: ${{ secrets.WPCOM_REDIRECT_URI }}
          WPCOM_SITE: ${{ secrets.WPCOM_SITE }}
          WPCOM_AUTHORIZATION_CODE: ${{ inputs.authorization_code }}
        run: |
          set -euo pipefail
          python scripts/wpcom_exchange_code.py

      - name: Verify token with token-info
        env:
          WPCOM_CLIENT_ID: ${{ secrets.WPCOM_CLIENT_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import requests
          import os

          token_json = json.loads(Path("wpcom_token_bundle/token.json").read_text(encoding="utf-8"))
          token = token_json["WPCOM_ACCESS_TOKEN"]
          client_id = os.environ["WPCOM_CLIENT_ID"]

          resp = requests.get(
              "https://public-api.wordpress.com/oauth2/token-info",
              params={"client_id": client_id, "token": token},
              timeout=60,
          )
          print(resp.text)
          resp.raise_for_status()
          PY

      - name: Verify token with /me
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import requests

          token_json = json.loads(Path("wpcom_token_bundle/token.json").read_text(encoding="utf-8"))
          token = token_json["WPCOM_ACCESS_TOKEN"]

          resp = requests.get(
              "https://public-api.wordpress.com/rest/v1.1/me",
              headers={"Authorization": f"Bearer {token}"},
              timeout=60,
          )
          print(resp.text)
          resp.raise_for_status()
          PY

      - name: Upload token bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: wpcom-token-bundle
          path: wpcom_token_bundle.zip
          if-no-files-found: error
          retention-days: 7
