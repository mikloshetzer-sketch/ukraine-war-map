name: Generate Daily War Brief

on:
  schedule:
    - cron: "50 4 * * *"   # minden nap 04:50 UTC
  workflow_dispatch:

jobs:
  generate-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run daily brief generator
        run: |
          python scripts/generate_daily_brief.py

      - name: Commit updated brief
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add data/brief_daily.txt data/brief_daily.json
          git commit -m "Update daily war brief" || echo "No changes"
          git push
