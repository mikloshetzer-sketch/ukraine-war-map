name: Daily WordPress Post

on:
  schedule:
    - cron: "10 5 * * *"   # every day at 05:10 UTC
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate daily brief
        run: |
          python scripts/generate_daily_brief.py

      - name: Verify generated files
        run: |
          test -f data/brief_daily.json
          test -f data/brief_daily.txt
          echo "brief_daily.json and brief_daily.txt exist"

      - name: Token sanity (safe)
        env:
          WPCOM_ACCESS_TOKEN: ${{ secrets.WPCOM_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import hashlib

          token = os.getenv("WPCOM_ACCESS_TOKEN", "")
          digest = hashlib.sha256(token.encode("utf-8")).hexdigest()

          print("token_len =", len(token))
          print("token_strip_len =", len(token.strip()))
          print("token_sha256_prefix =", digest[:12])
          PY

      - name: Verify WordPress.com token
        env:
          WPCOM_ACCESS_TOKEN: ${{ secrets.WPCOM_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS \
            -H "Authorization: Bearer ${WPCOM_ACCESS_TOKEN}" \
            "https://public-api.wordpress.com/oauth2/token-info" | python -m json.tool

      - name: Publish daily brief to WordPress
        env:
          WPCOM_ACCESS_TOKEN: ${{ secrets.WPCOM_ACCESS_TOKEN }}
          WPCOM_SITE: ${{ secrets.WPCOM_SITE }}
          WPCOM_STATUS: draft
        run: |
          set -euo pipefail
          python scripts/post_daily_wordpress.py
