name: Update UA War Sources

on:
  workflow_dispatch:
  schedule:
    - cron: "20 5 * * *"
    - cron: "20 11 * * *"
    - cron: "20 17 * * *"

permissions:
  contents: write

jobs:
  update-war-sources:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch Ukrainian war sources
        run: python scripts/fetch_ukrainian_war_sources.py

      - name: Filter Ukrainian war events
        run: python scripts/filter_ua_war_events.py

      - name: Geocode Ukrainian war events
        run: python scripts/geocode_ua_war_events.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ua_war_sources_latest.json
          git add data/ua_war_sources_latest.geo_candidates.json
          git add data/ua_war_events_filtered.json
          git add data/ua_war_events_summary.json
          git add data/ua_war_events_latest.geojson
          git add data/geocode_cache_ua.json
          git diff --cached --quiet || git commit -m "Update UA war sources and filtered events"

      - name: Push changes
        run: git push
